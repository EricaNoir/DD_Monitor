name: Studio Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-studio.txt
      - name: Install Studio dependencies
        run: python -m pip install -r requirements-studio.txt
      - name: Check Python syntax
        run: python -m compileall -q studio studio_main.py tests
      - name: Run offline unit and UI tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Upload example UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ui-python-${{ matrix.python }}
          path: .qa/*.png
          if-no-files-found: ignore
          retention-days: 7
