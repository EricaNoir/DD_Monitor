name: Portable Windows release

on:
  push:
    tags: ['studio-v*']

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install --isolated --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r packaging/requirements-windows.lock
      - name: Run offline tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check Python dependency advisories
        run: |
          python -m pip install --isolated --index-url https://pypi.org/simple pip-audit==2.9.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          python -m pip_audit --disable-pip --no-deps -r packaging/requirements-windows.lock --format json --output dist/dependency-audit.json
      - name: Build, inspect and smoke-test extracted portable ZIP
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^studio-v', ''
          python scripts/build_portable.py --version $version
      - name: Attest ZIP provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256|json)$' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "DD Monitor Studio $env:GITHUB_REF_NAME" --notes-file packaging/RELEASE-NOTES.md
      - name: Preserve build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-windows-build
          path: dist/*
          if-no-files-found: ignore
          retention-days: 7
